
name: YouTube Agent - Cloud Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Score sample YouTube hooks
        working-directory: skills/yt-script
        run: |
          printf '%s\n' \
            "I tested this for 7 days. Here is what changed." \
            "Three mistakes beginners make when learning AI." \
            "Before you buy another tool, try this first." \
            > sample_hooks.txt

          python hookscore.py --json sample_hooks.txt
